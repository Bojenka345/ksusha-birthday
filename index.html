<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>С Днём Рождения, Ксюша! 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    background-attachment: fixed;
    animation: gradient 12s ease infinite;
    text-align: center;
    padding: 20px 15px;
    min-height: 100vh;
  }

  @keyframes gradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .card {
    background: rgba(255, 255, 255, 0.92);
    padding: 40px 50px;
    border-radius: 30px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
    max-width: 620px;
    width: 100%;
    position: relative;
    z-index: 10;
    margin: auto;
    animation: appear 1.5s ease;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .photo-frame {
    width: 180px;
    height: 180px;
    margin: 0 auto 25px;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, #ff6b9d, #ffd93d, #6bcbff, #b16bff);
    background-size: 300% 300%;
    animation: gradient 6s ease infinite, float 3s ease-in-out infinite;
    box-shadow: 0 15px 40px rgba(214, 51, 108, 0.35);
    position: relative;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .photo-frame::before,
  .photo-frame::after {
    content: '✨';
    position: absolute;
    font-size: 1.5em;
    animation: sparkle 2s infinite;
  }

  .photo-frame::before {
    top: -10px;
    right: -5px;
    animation-delay: 0.5s;
  }

  .photo-frame::after {
    bottom: -10px;
    left: -5px;
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #fbc2eb;
  }

  h1 {
    font-size: 2.4em;
    color: #d6336c;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(214, 51, 108, 0.15);
  }

  p {
    font-size: 1.2em;
    line-height: 1.7;
    color: #444;
    margin-bottom: 15px;
  }

  .heart {
    font-size: 2.5em;
    animation: beat 1s infinite;
    display: inline-block;
    margin-top: 10px;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  .music-player {
    margin: 25px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    background: linear-gradient(135deg, #fff0f6, #ffe4ec);
    padding: 12px 22px;
    border-radius: 50px;
    box-shadow: inset 0 2px 8px rgba(214, 51, 108, 0.1);
    max-width: 380px;
  }

  .music-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: white;
    font-size: 1.3em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(214, 51, 108, 0.35);
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .music-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(214, 51, 108, 0.55);
  }

  .music-btn:active {
    transform: scale(0.95);
  }

  .music-info {
    text-align: left;
    flex: 1;
    min-width: 0;
  }

  .music-title {
    font-size: 0.85em;
    color: #d6336c;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .music-status {
    font-size: 0.75em;
    color: #999;
    margin-top: 2px;
  }

  .equalizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 20px;
  }

  .equalizer span {
    width: 4px;
    background: linear-gradient(to top, #d6336c, #ff6b9d);
    border-radius: 2px;
    height: 20%;
    transition: height 0.2s;
  }

  .equalizer.playing span {
    animation: eq 0.8s ease-in-out infinite;
  }

  .equalizer.playing span:nth-child(1) { animation-delay: 0s; }
  .equalizer.playing span:nth-child(2) { animation-delay: 0.1s; }
  .equalizer.playing span:nth-child(3) { animation-delay: 0.2s; }
  .equalizer.playing span:nth-child(4) { animation-delay: 0.3s; }
  .equalizer.playing span:nth-child(5) { animation-delay: 0.4s; }

  @keyframes eq {
    0%, 100% { height: 20%; }
    50% { height: 100%; }
  }

  .btn {
    margin-top: 20px;
    padding: 16px 40px;
    font-size: 1.2em;
    font-family: 'Georgia', serif;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(214, 51, 108, 0.4);
    transition: all 0.3s ease;
    animation: pulse 2s infinite;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 25px rgba(214, 51, 108, 0.4); }
    50% { box-shadow: 0 8px 40px rgba(214, 51, 108, 0.7); }
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.05);
  }

  .btn:active {
    transform: translateY(0) scale(0.98);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: default;
    animation: none;
  }

  .balloon {
    position: fixed;
    bottom: -150px;
    width: 60px;
    height: 75px;
    border-radius: 50%;
    z-index: 5;
    animation: rise linear forwards;
    pointer-events: none;
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 90px;
    background: rgba(0, 0, 0, 0.25);
  }

  .balloon::before {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 10px solid rgba(0, 0, 0, 0.15);
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0); opacity: 1; }
    100% { transform: translateY(-120vh) translateX(var(--drift, 0px)); opacity: 1; }
  }

  .confetti-piece {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 12px;
    z-index: 100;
    animation: fall linear forwards;
    pointer-events: none;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* 📱 Адаптив для телефонов */
  @media (max-width: 600px) {
    body {
      padding: 15px 10px;
      align-items: flex-start;
    }
    .card {
      padding: 30px 22px;
      border-radius: 22px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    h1 { font-size: 1.7em; margin-bottom: 15px; }
    p { font-size: 1.05em; line-height: 1.6; }
    .photo-frame { width: 140px; height: 140px; }
    .heart { font-size: 2em; }
    .music-player {
      padding: 10px 15px;
      gap: 10px;
      max-width: 100%;
    }
    .music-btn { width: 44px; height: 44px; font-size: 1.1em; }
    .music-title { font-size: 0.8em; }
    .music-status { font-size: 0.7em; }
    .btn { padding: 14px 30px; font-size: 1.05em; }
  }

  @media (max-width: 380px) {
    .card { padding: 25px 18px; }
    h1 { font-size: 1.5em; }
    p { font-size: 1em; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="photo-frame">
    <img src="photo.jpg" alt="Ксюша" id="ksushaPhoto">
  </div>

  <h1>С Днём Рождения, Ксюша! 🎂</h1>

  <div class="music-player">
    <button class="music-btn" id="musicBtn">▶</button>
    <div class="music-info">
      <div class="music-title" id="musicTitle">🎵 Happy Birthday</div>
      <div class="music-status" id="musicStatus">Нажми ▶ чтобы включить</div>
    </div>
    <div class="equalizer" id="equalizer">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <audio id="bgMusic" loop playsinline>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <p>
    Дорогая Ксюша!<br><br>
    Поздравляем тебя с самым тёплым и радостным праздником!<br>
    Желаем тебе море счастья, крепкого здоровья,<br>
    исполнения всех желаний и людей рядом,<br>
    которые тебя по-настоящему любят. 💕
  </p>
  <p><strong>Мы тебя очень любим!</strong></p>
  <div class="heart">❤️</div>
  <br>
  <button class="btn" id="celebrateBtn">🎉 Нажми меня! 🎉</button>
</div>

<script>
  const music = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  const musicStatus = document.getElementById('musicStatus');
  const equalizer = document.getElementById('equalizer');

  musicBtn.addEventListener('click', () => {
    if (music.paused) {
      music.play()
        .then(() => {
          musicBtn.textContent = '❚❚';
          musicStatus.textContent = 'Играет 🎶';
          equalizer.classList.add('playing');
        })
        .catch(err => {
          musicStatus.textContent = '⚠ Файл music.mp3 не найден';
          console.error('Ошибка воспроизведения:', err);
        });
    } else {
      music.pause();
      musicBtn.textContent = '▶';
      musicStatus.textContent = 'Пауза';
      equalizer.classList.remove('playing');
    }
  });

  music.addEventListener('ended', () => {
    musicBtn.textContent = '▶';
    musicStatus.textContent = 'Нажми ▶ чтобы включить';
    equalizer.classList.remove('playing');
  });

  const btn = document.getElementById('celebrateBtn');

  const balloonColors = [
    '#ff6b9d', '#ffd93d', '#6bcbff', '#b16bff',
    '#ff9a3d', '#4dff88', '#ff4d6d', '#ffb3d9'
  ];

  const confettiColors = [
    '#ff6b9d', '#ffd93d', '#6bcbff', '#b16bff',
    '#ff9a3d', '#4dff88', '#ff4d6d', '#ffffff'
  ];

  function createBalloon() {
    const balloon = document.createElement('div');
    balloon.className = 'balloon';

    const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
    const size = 50 + Math.random() * 40;
    const left = Math.random() * 95;
    const duration = 4 + Math.random() * 3;
    const drift = (Math.random() - 0.5) * 200;

    balloon.style.background = `radial-gradient(circle at 30% 30%, ${color}, ${shadeColor(color, -30)})`;
    balloon.style.width = size + 'px';
    balloon.style.height = (size * 1.25) + 'px';
    balloon.style.left = left + 'vw';
    balloon.style.setProperty('--drift', drift + 'px');
    balloon.style.animationDuration = duration + 's';

    document.body.appendChild(balloon);
    setTimeout(() => balloon.remove(), duration * 1000 + 500);
  }

  function createConfetti() {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';

    const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    const size = 8 + Math.random() * 10;
    const left = Math.random() * 100;
    const duration = 2.5 + Math.random() * 2;
    const isCircle = Math.random() > 0.5;

    piece.style.background = color;
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.left = left + 'vw';
    piece.style.borderRadius = isCircle ? '50%' : '2px';
    piece.style.animationDuration = duration + 's';

    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), duration * 1000 + 500);
  }

  function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00ff) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000ff) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
  }

  let isPlaying = false;

  function celebrate() {
    if (isPlaying) return;
    isPlaying = true;
    btn.disabled = true;
    btn.textContent = '🎊 Ура-а-а! 🎊';

    if (music.paused) {
      music.play().then(() => {
        musicBtn.textContent = '❚❚';
        musicStatus.textContent = 'Играет 🎶';
        equalizer.classList.add('playing');
      }).catch(() => {});
    }

    for (let i = 0; i < 25; i++) {
      setTimeout(createBalloon, i * 120);
    }

    let confettiCount = 0;
    const confettiInterval = setInterval(() => {
      for (let i = 0; i < 4; i++) createConfetti();
      confettiCount++;
      if (confettiCount > 40) clearInterval(confettiInterval);
    }, 80);

    setTimeout(() => {
      isPlaying = false;
      btn.disabled = false;
      btn.textContent = '🎈 Ещё раз! 🎈';
    }, 6000);
  }

  btn.addEventListener('click', celebrate);
</script>

</body>
</html>
